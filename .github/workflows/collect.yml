# 收集子知识库元数据并重新部署根站点
# 触发方式:
#   1. repository_dispatch — 由子仓库 deploy 完成后自动触发
#   2. workflow_dispatch  — 手动触发（可选指定单个仓库）
name: Collect & Deploy

on:
  repository_dispatch:
    types: [sub_repo_updated]

  workflow_dispatch:
    inputs:
      repo:
        description: '仅收集指定仓库（如 TNotes.leetcode），留空则收集全部'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-pages
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test concurrent collection
        run: node --test scripts/collect-ci.test.mjs

      # dispatch 全量收集：被取消的前序通知不会丢失；手动运行仍可指定单库。
      # 并发推进 main 时，丢弃本次派生结果，在最新根配置上重新收集后重试。
      - name: Collect and commit metadata
        env:
          COLLECT_EVENT: ${{ github.event_name }}
          COLLECT_REPO: ${{ github.event.inputs.repo }}
          TRIGGER_REPO: ${{ github.event.client_payload.repo }}
          TRIGGER_SHA: ${{ github.event.client_payload.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/collect-ci.mjs

      # 构建 VitePress 站点
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with VitePress
        run: pnpm tn:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: TNotes
      url: ${{ steps.deployment.outputs.page_url }}
    needs: collect-and-deploy
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
